<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 0 auto; padding: 24px; color: #1a1a1a;">
  <div style="border-bottom: 2px solid #4a90e2; padding-bottom: 12px; margin-bottom: 24px;">
    <h1 style="margin: 0; font-size: 20px; color: #4a90e2;">OSCAL Hub</h1>
  </div>
  <h2>New Comment on ${ticketId}</h2>
  <p><strong>${authorName}</strong> added a comment on your ticket <strong>${title}</strong>.</p>
  <div style="background: #f5f7fa; border-left: 4px solid #4a90e2; padding: 12px 16px; margin: 16px 0; border-radius: 0 4px 4px 0;">
    <p style="margin: 0; white-space: pre-wrap;">${commentBody}</p>
  </div>
  <p style="color: #555; font-size: 13px;">
    Status: <strong>${status}</strong> &nbsp;|&nbsp; Priority: <strong>${priority}</strong>
  </p>
  <p>
    <a href="${ticketUrl}" style="display: inline-block; background: #4a90e2; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px;">View Ticket</a>
  </p>
  <hr style="border: none; border-top: 1px solid #e5e5e5; margin: 32px 0 12px;">
  <p style="font-size: 12px; color: #888;">You received this email because you are involved with ticket ${ticketId} on OSCAL Hub.</p>
</body>
</html>
