<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 0 auto; padding: 24px; color: #1a1a1a;">
  <div style="border-bottom: 2px solid #4a90e2; padding-bottom: 12px; margin-bottom: 24px;">
    <h1 style="margin: 0; font-size: 20px; color: #4a90e2;">OSCAL Hub</h1>
  </div>
  <h2>Ticket Status Updated</h2>
  <p>The status of your ticket <strong>${ticketId} — ${title}</strong> has changed.</p>
  <table style="width: 100%; border-collapse: collapse; margin: 16px 0;">
    <tr><td style="padding: 6px 0; color: #555; width: 110px;">Previous</td><td style="padding: 6px 0;">${oldStatus}</td></tr>
    <tr><td style="padding: 6px 0; color: #555;">Current</td><td style="padding: 6px 0; font-weight: 600; color: #2e7d32;">${newStatus}</td></tr>
  </table>
  <p id="note-section" style="${adminNote}">
    <strong>Note from the team:</strong><br>
    ${adminNote}
  </p>
  <p>
    <a href="${ticketUrl}" style="display: inline-block; background: #4a90e2; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px;">View Ticket</a>
  </p>
  <hr style="border: none; border-top: 1px solid #e5e5e5; margin: 32px 0 12px;">
  <p style="font-size: 12px; color: #888;">You received this email because you filed ticket ${ticketId} on OSCAL Hub.</p>
</body>
</html>
