# ==============================================================================
# OSCAL CLI API - Base Configuration
# ==============================================================================
# This file contains base configuration shared across all environments.
# Environment-specific settings are in application-{profile}.properties
#
# Active Profile: Set via SPRING_PROFILES_ACTIVE environment variable
#   - dev: Development (default)
#   - staging: Staging/Testing
#   - prod: Production
# ==============================================================================

# Spring Boot 4 ships Jackson 3 (tools.jackson) as the default JSON mapper.
# The application code is still on Jackson 2 (com.fasterxml.jackson) so we
# tell Spring's HTTP message converters and WebSocket messaging to keep
# using Jackson 2 via spring-boot-jackson2. Remove these once a full
# Jackson 3 migration lands.
spring.http.converters.preferred-json-mapper=jackson2
spring.websocket.messaging.preferred-json-mapper=jackson2

# Application Metadata
spring.application.name=oscal-cli-api
spring.application.version=@project.version@
app.display-name=OSCAL Hub

# Server Configuration
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# CORS Configuration (Override in environment-specific files)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}

# Jackson Configuration
# Note: spring.jackson.* binds to Jackson 3's enum classes in Spring Boot 4,
# even when application code uses Jackson 2 via spring-boot-jackson2.
# WRITE_DATES_AS_TIMESTAMPS moved out of SerializationFeature in Jackson 3
# (it's now DatatypeFeature, and ISO-8601 is the default), so it's omitted.
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.INDENT_OUTPUT=false

# File Upload Limits
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}
spring.servlet.multipart.enabled=true

# Database Configuration (Override in environment-specific files)
# Development: PostgreSQL in Docker (see docker-compose-postgres.yml)
# Production: PostgreSQL (override via environment variables)
# Testing: H2 in-memory (configured in test profile)
# Defaults match docker-compose-postgres.yml for out-of-the-box dev experience
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/oscal_dev}
spring.datasource.driverClassName=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DB_USERNAME:oscal_user}
spring.datasource.password=${DB_PASSWORD:oscal_dev_password}

# JPA/Hibernate Configuration
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
# `validate` means Hibernate verifies the entity model matches the actual
# database schema on startup and refuses to start if anything is missing,
# but never modifies the schema itself. Flyway is the only path that mutates
# schema (see spring.flyway.* below). This eliminates the silent drift
# previously caused by ddl-auto=update — e.g., NOT NULL columns that
# Hibernate failed to add on populated tables and then queried anyway.
#
# To override during local debugging or first-time DB bootstrap:
#   DB_DDL_AUTO=update ./dev.sh
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# H2 Console (Removed - using PostgreSQL)
# H2 is only available in test scope for unit/integration testing
spring.h2.console.enabled=false

# Flyway Database Migration Configuration
#
# Schema management policy: Flyway is the source of truth. Every schema change
# lands as a versioned `V<n>__<desc>.sql` file under db/migration/. Flyway runs
# automatically on application startup. Hibernate's ddl-auto is set to
# `validate` (see below) — Hibernate verifies the entity model matches the
# actual schema and fails fast if anything is missing, but never modifies the
# schema itself. This guarantees DB and code cannot silently drift.
#
# How fresh vs existing databases bootstrap:
#
#   Fresh DB (empty schema, no flyway_schema_history table):
#       Flyway ignores baseline-version, runs all discovered migrations.
#       V1.0__baseline.sql contains the full current schema (generated from
#       a working pg_dump) and brings the DB to the same state every time.
#
#   Existing DB (schema present from earlier ddl-auto=update runs, no
#   flyway_schema_history table):
#       Flyway sees a non-empty schema with no history, baselines at
#       version 1.0 because of baseline-on-migrate=true, and treats V1.0
#       as already-applied. Only migrations strictly greater than 1.0
#       run going forward (V1.24, V1.25, ...).
#
# The historical migrations V1.5..V1.23 that built the schema incrementally
# during the ddl-auto=update era are preserved under db/historical/ for
# reference but are NOT under db/migration/ so Flyway does not load them.
#
# To override (e.g. to disable Flyway temporarily during local debugging):
#   SPRING_FLYWAY_ENABLED=false ./dev.sh
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION:1.0}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=false

# JWT Configuration
# CRITICAL: JWT_SECRET must be set via environment variable in staging/production
# Minimum 256 bits (32 characters) required for HS256 algorithm
# Default provided for development only - NEVER use in production
jwt.secret=${JWT_SECRET:dev-only-jwt-secret-do-not-use-in-production-replace-me-with-secure-key}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Encryption Configuration (for MFA TOTP secrets)
# Must be 32 bytes (256 bits) - either 64 hex characters or base64-encoded
# Generate with: openssl rand -hex 32
# IMPORTANT: Override ENCRYPTION_KEY in production with a secure randomly generated key!
encryption.key=${ENCRYPTION_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}

# Logging Configuration
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.gov.nist.oscal=${LOG_LEVEL_OSCAL:DEBUG}

# Azure Blob Storage Configuration
# IMPORTANT: Set credentials using .env file or environment variables
# NEVER commit connection strings to version control
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:oscal-files}
azure.storage.library-container-name=${AZURE_STORAGE_LIBRARY_CONTAINER_NAME:oscal-library}
azure.storage.build-container-name=${AZURE_STORAGE_BUILD_CONTAINER_NAME:oscal-build-storage}
azure.storage.build-folder=${AZURE_STORAGE_BUILD_FOLDER:build}

# Springdoc OpenAPI/Swagger Configuration
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.syntaxHighlight.theme=monokai
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.css-url=/swagger-custom.css
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}

# Spring Boot Actuator Configuration
# Health and monitoring endpoints for production observability
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info,metrics,prometheus}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_SHOW_DETAILS:when-authorized}
management.endpoint.health.show-components=${ACTUATOR_HEALTH_SHOW_COMPONENTS:when-authorized}
management.health.defaults.enabled=true

# Health Check Configuration
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.diskspace.threshold=${HEALTH_DISKSPACE_THRESHOLD:10MB}
management.health.ping.enabled=true

# Info Endpoint Configuration
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
management.info.git.enabled=true
management.info.git.mode=full
management.info.build.enabled=true

# Metrics Configuration
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.http=true
management.metrics.enable.logback=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${SPRING_PROFILES_ACTIVE:default}

# Prometheus Metrics Export
management.prometheus.metrics.export.enabled=true
management.prometheus.metrics.export.step=60s

# Security Configuration
security.headers.enabled=${SECURITY_HEADERS_ENABLED:false}
security.require-https=${SECURITY_REQUIRE_HTTPS:false}

# Rate Limiting Configuration (Defaults - override in environment profiles)
rate.limit.enabled=${RATE_LIMIT_ENABLED:false}
rate.limit.login.attempts=${RATE_LIMIT_LOGIN:5}
rate.limit.login.duration=${RATE_LIMIT_LOGIN_DURATION:60}

# Account Security Configuration
account.lockout.enabled=${ACCOUNT_LOCKOUT_ENABLED:false}
account.lockout.attempts=${ACCOUNT_LOCKOUT_ATTEMPTS:5}

# File Validation Configuration
# Security: Validates uploaded files to prevent malicious uploads
file.validation.max-file-size=${FILE_VALIDATION_MAX_SIZE:10485760}
file.validation.max-logo-size=${FILE_VALIDATION_MAX_LOGO_SIZE:2097152}
file.validation.enable-magic-number-validation=${FILE_VALIDATION_MAGIC_NUMBER:true}

# ClamAV Malware Scanning Configuration
# Security: Scans uploaded files for malware using ClamAV daemon
# Requires ClamAV to be running (e.g., as sidecar container on port 3310)
file.validation.enable-virus-scanning=${MALWARE_SCANNING_ENABLED:false}
file.validation.clamav-host=${CLAMAV_HOST:localhost}
file.validation.clamav-port=${CLAMAV_PORT:3310}
file.validation.clamav-timeout-ms=${CLAMAV_TIMEOUT_MS:30000}
file.validation.clamav-chunk-size=${CLAMAV_CHUNK_SIZE:2048}
file.validation.clamav-fail-open=${CLAMAV_FAIL_OPEN:false}

# Account Security Configuration
# Security: Password complexity, account lockout, and login tracking
# Password Complexity Requirements
account.security.password-min-length=${PASSWORD_MIN_LENGTH:10}
account.security.password-max-length=${PASSWORD_MAX_LENGTH:128}
account.security.password-require-uppercase=${PASSWORD_REQUIRE_UPPERCASE:true}
account.security.password-require-lowercase=${PASSWORD_REQUIRE_LOWERCASE:true}
account.security.password-require-digit=${PASSWORD_REQUIRE_DIGIT:true}
account.security.password-require-special=${PASSWORD_REQUIRE_SPECIAL:true}
account.security.password-check-common-passwords=${PASSWORD_CHECK_COMMON:true}
account.security.password-prevent-username-in-password=${PASSWORD_PREVENT_USERNAME:true}

# Account Lockout Configuration
account.security.lockout-enabled=${ACCOUNT_LOCKOUT_ENABLED:true}
account.security.lockout-max-attempts=${ACCOUNT_LOCKOUT_MAX_ATTEMPTS:5}
account.security.lockout-duration-seconds=${ACCOUNT_LOCKOUT_DURATION:900}
account.security.lockout-window-seconds=${ACCOUNT_LOCKOUT_WINDOW:600}
account.security.track-login-attempts-by-ip=${TRACK_LOGIN_BY_IP:true}
account.security.ip-lockout-max-attempts=${IP_LOCKOUT_MAX_ATTEMPTS:10}

# Password Expiration Configuration
account.security.password-expiration-enabled=${PASSWORD_EXPIRATION_ENABLED:false}
account.security.password-expiration-days=${PASSWORD_EXPIRATION_DAYS:90}
account.security.password-expiration-warning-days=${PASSWORD_EXPIRATION_WARNING_DAYS:14}

# Password History Configuration
account.security.password-history-enabled=${PASSWORD_HISTORY_ENABLED:false}
account.security.password-history-count=${PASSWORD_HISTORY_COUNT:5}

# Login Tracking Configuration
account.security.track-successful-logins=${TRACK_SUCCESSFUL_LOGINS:true}
account.security.track-failed-logins=${TRACK_FAILED_LOGINS:true}
account.security.max-login-history-entries=${MAX_LOGIN_HISTORY_ENTRIES:100}

# Email Notifications Configuration
account.security.email-notifications-enabled=${EMAIL_NOTIFICATIONS_ENABLED:false}
account.security.email-on-account-lockout=${EMAIL_ON_LOCKOUT:false}
account.security.email-on-password-change=${EMAIL_ON_PASSWORD_CHANGE:false}

# SendGrid transactional email
email.enabled=${EMAIL_ENABLED:true}
email.sendgrid.api-key=${SENDGRID_API_KEY:}
email.sendgrid.from-email=${SENDGRID_FROM_EMAIL:noreply@oscalhub.local}
email.sendgrid.from-name=${SENDGRID_FROM_NAME:OSCAL Hub}
app.base-url=${APP_BASE_URL:http://localhost:3000}

# Audit Logging Configuration
# Security: Comprehensive event logging for compliance and security monitoring
audit.logging.enabled=${AUDIT_LOGGING_ENABLED:true}
audit.logging.log-authentication=${AUDIT_LOG_AUTHENTICATION:true}
audit.logging.log-authorization=${AUDIT_LOG_AUTHORIZATION:true}
audit.logging.log-data-access=${AUDIT_LOG_DATA_ACCESS:true}
audit.logging.log-configuration=${AUDIT_LOG_CONFIGURATION:true}
audit.logging.log-security=${AUDIT_LOG_SECURITY:true}
audit.logging.log-system=${AUDIT_LOG_SYSTEM:true}
audit.logging.log-to-application-log=${AUDIT_LOG_TO_APP_LOG:true}
audit.logging.retention-low-risk-days=${AUDIT_RETENTION_LOW_DAYS:90}
audit.logging.retention-medium-risk-days=${AUDIT_RETENTION_MEDIUM_DAYS:90}
audit.logging.retention-high-risk-days=${AUDIT_RETENTION_HIGH_DAYS:90}
audit.logging.auto-cleanup=${AUDIT_AUTO_CLEANUP:true}
audit.logging.cleanup-schedule=${AUDIT_CLEANUP_SCHEDULE:0 0 2 * * ?}
audit.logging.cleanup-batch-size=${AUDIT_CLEANUP_BATCH_SIZE:1000}

# Request Logging Configuration
# Captures all HTTP requests for security monitoring and analytics
request.logging.enabled=${REQUEST_LOGGING_ENABLED:true}
request.logging.exclude-paths=${REQUEST_LOGGING_EXCLUDE_PATHS:/api/health,/actuator,/swagger,/v3/api-docs,/favicon.ico}

# SIEM (Security Information and Event Management) Integration
# Forwards audit events to external SIEM systems via webhook
siem.enabled=${SIEM_ENABLED:false}
siem.webhook-url=${SIEM_WEBHOOK_URL:}
siem.authorization-header=${SIEM_AUTH_HEADER:}
siem.auth-header-name=${SIEM_AUTH_HEADER_NAME:Authorization}
siem.format=${SIEM_FORMAT:json}
siem.batch-size=${SIEM_BATCH_SIZE:100}
siem.batch-interval-seconds=${SIEM_BATCH_INTERVAL:60}
siem.include-categories=${SIEM_INCLUDE_CATEGORIES:}
siem.min-risk-level=${SIEM_MIN_RISK_LEVEL:LOW}
siem.max-retries=${SIEM_MAX_RETRIES:3}
siem.retry-delay-ms=${SIEM_RETRY_DELAY_MS:1000}
siem.retry-backoff-multiplier=${SIEM_RETRY_BACKOFF:2.0}
siem.connection-timeout-ms=${SIEM_CONNECTION_TIMEOUT:5000}
siem.read-timeout-ms=${SIEM_READ_TIMEOUT:30000}
siem.failed-events-only=${SIEM_FAILED_EVENTS_ONLY:false}
# CEF format settings
siem.cef-vendor=${SIEM_CEF_VENDOR:NIST}
siem.cef-product=${SIEM_CEF_PRODUCT:OSCAL-Tools}
siem.cef-version=${SIEM_CEF_VERSION:1.0}
# Syslog format settings
siem.syslog-facility=${SIEM_SYSLOG_FACILITY:LOCAL0}
siem.syslog-hostname=${SIEM_SYSLOG_HOSTNAME:}
siem.syslog-app-name=${SIEM_SYSLOG_APP_NAME:oscal-api}

# Production deployments (Cloud Run / Dockerfile) set SPRING_PROFILES_ACTIVE
# directly (e.g. "gcp" or "cloud"). When unset, fall back to the default
# profile. Spring Boot 4 rejects profile names that don't start with a
# letter or digit, so the previous bash-style ${K_SERVICE:+cloud} default
# (which resolved to literal "+cloud" outside Cloud Run) no longer parses.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}
