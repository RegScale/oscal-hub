# Test profile: keep all production properties, override only the bits that
# can't run in CI. Activated for every test via the Surefire plugin's
# spring.profiles.active=test system property.

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Flyway runs real migrations against H2 by default; let JPA build the schema
# in tests instead so we don't have to maintain a separate migration tree.
spring.flyway.enabled=false
