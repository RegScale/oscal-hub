# OpenTelemetry Collector configuration for OSCAL Hub — Phase 2.
# Receives OTLP from backend service; exports traces to Cloud Trace,
# metrics to Cloud Monitoring (Managed Prometheus), logs to Cloud Logging.
# Log records carrying an event.name attribute are additionally routed to
# Pub/Sub for downstream BigQuery analytics (Phase 2 events pipeline).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - https://*.run.app
            # Add custom-domain origins here once configured.

processors:
  batch:
    send_batch_size: 1024
    timeout: 5s

  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 64

  resourcedetection:
    detectors: [gcp, env]
    timeout: 2s
    override: false

  # Promote OTel baggage entries to span attributes so they are queryable
  # in Cloud Trace. The Java OTel SDK's BaggageSpanProcessor copies baggage
  # entries onto spans as attributes["baggage.<key>"]; we re-key them to
  # well-known names here so Cloud Trace filters are consistent.
  transform/baggage_to_attrs:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["user.id"], attributes["baggage.user.id"]) where attributes["baggage.user.id"] != nil
          - set(attributes["org.id"], attributes["baggage.org.id"]) where attributes["baggage.org.id"] != nil
          - set(attributes["user.role.global"], attributes["baggage.user.role.global"]) where attributes["baggage.user.role.global"] != nil
          - set(attributes["user.role.org"], attributes["baggage.user.role.org"]) where attributes["baggage.user.role.org"] != nil

  # Strip likely-PII patterns from http.url. Belt-and-suspenders; the
  # application should not emit these, but we scrub at the collector too.
  # Uses transform (not attributes) because the regex replace function
  # (replace_pattern) lives in the transform processor.
  transform/redact:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - replace_pattern(attributes["http.url"], "(?i)(token|secret|password|key)=[^&]+", "$$1=REDACTED")
    log_statements:
      - context: log
        statements:
          - replace_pattern(attributes["http.url"], "(?i)(token|secret|password|key)=[^&]+", "$$1=REDACTED")

  # Drop OTel-emitted JVM memory metrics that collide with Cloud Run's
  # auto-published container memory metrics in Managed Prometheus. The
  # collision causes "value type for metric conflicts with the existing
  # value type" rejections on ~10% of metric points per batch. Cloud Run
  # already provides container/memory/* and container/cpu/* metrics, so
  # the OTel runtime-telemetry-java duplicates add no signal.
  filter/drop_runtime_jvm_memory:
    error_mode: ignore
    metrics:
      metric:
        - 'name == "jvm.memory.used"'
        - 'name == "jvm.memory.committed"'
        - 'name == "jvm.memory.limit"'
        - 'name == "jvm.memory.used_after_last_gc"'

  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 100
    policies:
      - name: errors-always
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow-always
        type: latency
        latency:
          threshold_ms: 1000
      - name: baseline-25pct
        type: probabilistic
        probabilistic:
          sampling_percentage: 25

exporters:
  googlecloud:
    log:
      default_log_name: oscal-hub-collector
  googlemanagedprometheus: {}
  googlecloudpubsub:
    project: "${env:GCP_PROJECT_ID}"
    topic: "projects/${env:GCP_PROJECT_ID}/topics/${env:OTEL_EVENTS_TOPIC}"
  # Diagnostic: log every log record's full structure to stdout so we can see
  # what attributes/scope/body the collector actually receives. Phase 4 task:
  # remove once routing is verified.
  debug:
    verbosity: detailed

# The routing connector (v0.151.0+) replaces the deprecated routing processor.
# It acts as both an exporter for the ingest pipeline and a receiver for the
# two downstream pipelines, splitting the log stream based on OTTL conditions.
connectors:
  routing/events:
    # Propagate errors so we see if a condition has a syntax problem.
    error_mode: propagate
    default_pipelines: [logs/default]
    table:
      # Single condition: match by instrumentation scope (SLF4J logger name).
      # Verified via debug exporter that records carry InstrumentationScope
      # "oscal-hub.events". This is the cleanest, most reliable match.
      - context: log
        condition: instrumentation_scope.name == "oscal-hub.events"
        pipelines: [logs/events]

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, transform/baggage_to_attrs, transform/redact, tail_sampling, batch]
      exporters: [googlecloud]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, filter/drop_runtime_jvm_memory, batch]
      exporters: [googlemanagedprometheus]
    # logs/ingest: all log records pass through shared processors once, then
    # enter the routing connector which decides which downstream pipeline to use.
    # Debug exporter logs full structure of every record for diagnosis.
    logs/ingest:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, transform/redact, batch]
      exporters: [routing/events, debug]
    # logs/default: records without event.name go to Cloud Logging.
    logs/default:
      receivers: [routing/events]
      exporters: [googlecloud]
    # logs/events: records with event.name go to Pub/Sub for BigQuery analytics.
    logs/events:
      receivers: [routing/events]
      exporters: [googlecloudpubsub]
