{{- if not .Values.secrets.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secrets" (include "oscal-hub.fullname" .) }}
  labels:
    {{- include "oscal-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ required "secrets.jwtSecret is required (or set secrets.existingSecret to reference a pre-created secret)" .Values.secrets.jwtSecret | quote }}
  {{- if .Values.postgresql.enabled }}
  db-password: {{ required "secrets.dbPassword is required when postgresql.enabled=true (or set secrets.existingSecret)" .Values.secrets.dbPassword | quote }}
  {{- else if .Values.secrets.dbPassword }}
  db-password: {{ .Values.secrets.dbPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.azureStorageConnectionString }}
  azure-storage-connection-string: {{ .Values.secrets.azureStorageConnectionString | quote }}
  {{- end }}
  {{- if .Values.secrets.awsAccessKeyId }}
  aws-access-key-id: {{ .Values.secrets.awsAccessKeyId | quote }}
  aws-secret-access-key: {{ required "secrets.awsSecretAccessKey is required when awsAccessKeyId is set" .Values.secrets.awsSecretAccessKey | quote }}
  {{- end }}
{{- end }}
