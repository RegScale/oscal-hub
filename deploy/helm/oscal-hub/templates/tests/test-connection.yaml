apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "oscal-hub.fullname" . }}-test-connection"
  labels:
    {{- include "oscal-hub.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command:
        - sh
        - -c
        - |
          set -eu
          echo "Probing backend health..."
          curl -fsS --max-time 10 \
            "http://{{ include "oscal-hub.fullname" . }}:{{ .Values.service.ports.backend }}/api/health"
          echo "Probing frontend root..."
          curl -fsS --max-time 10 -o /dev/null \
            "http://{{ include "oscal-hub.fullname" . }}:{{ .Values.service.ports.frontend }}/"
          echo "OK"
