apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oscal-hub.fullname" . }}-config
  labels:
    {{- include "oscal-hub.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: prod

  # Database (driver + URL — credentials come from the secret)
  DB_URL: {{ include "oscal-hub.dbUrl" . | quote }}
  DB_DRIVER: org.postgresql.Driver
  DB_DIALECT: org.hibernate.dialect.PostgreSQLDialect
  DB_USERNAME: {{ include "oscal-hub.dbUsername" . | quote }}

  # Public origin / CORS
  CORS_ALLOWED_ORIGINS: {{ include "oscal-hub.publicOrigin" . | quote }}

  # JWT
  JWT_EXPIRATION: {{ .Values.config.jwtExpirationMs | quote }}

  # Hardening
  SECURITY_HEADERS_ENABLED: {{ .Values.config.securityHeadersEnabled | quote }}
  SECURITY_REQUIRE_HTTPS: {{ .Values.config.securityRequireHttps | quote }}
  RATE_LIMIT_ENABLED: {{ .Values.config.rateLimitEnabled | quote }}
  ACCOUNT_LOCKOUT_ENABLED: {{ .Values.config.accountLockoutEnabled | quote }}
  AUDIT_LOGGING_ENABLED: {{ .Values.config.auditLoggingEnabled | quote }}
  H2_CONSOLE_ENABLED: {{ .Values.config.h2ConsoleEnabled | quote }}
  SWAGGER_ENABLED: {{ .Values.config.swaggerEnabled | quote }}

  # Logging
  LOG_LEVEL_ROOT: {{ .Values.config.logLevelRoot | quote }}
  LOG_LEVEL_OSCAL: {{ .Values.config.logLevelOscal | quote }}

  # JVM
  JAVA_OPTS: {{ .Values.config.javaOpts | quote }}

  # Frontend
  NODE_ENV: production
  PORT: "3000"

  # Storage provider
  STORAGE_PROVIDER: {{ .Values.config.storageProvider | quote }}
  {{- if eq .Values.config.storageProvider "azure" }}
  AZURE_STORAGE_CONTAINER_NAME: {{ .Values.objectStorage.azure.containerName | quote }}
  {{- end }}
  {{- if eq .Values.config.storageProvider "s3" }}
  AWS_REGION: {{ .Values.objectStorage.s3.region | quote }}
  AWS_S3_BUCKET_BUILD: {{ .Values.objectStorage.s3.bucket | quote }}
  {{- end }}
  {{- if eq .Values.config.storageProvider "gcs" }}
  GCS_BUCKET: {{ .Values.objectStorage.gcs.bucket | quote }}
  {{- end }}
