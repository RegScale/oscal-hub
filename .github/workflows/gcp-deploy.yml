name: Deploy to GCP

# Strategy:
#   PR  -> tf fmt + validate + plan, comment plan on PR (no infra changes)
#   main-> build + push image, then tf apply with new image_tag, then health check
#
# Branch protection on `main` enforces "PR approved + CI green" before merge,
# so a push event here only happens after human review.
#
# One-time setup is documented in docs/CICD-BOOTSTRAP.md (GCS state bucket,
# Workload Identity Federation pool/provider, deploy SA, GitHub vars).

on:
  pull_request:
    branches: [main]
    paths:
      - 'back-end/**'
      - 'front-end/**'
      - 'cli/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'terraform/gcp/**'
      - '.github/workflows/gcp-deploy.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Serialize anything touching infra; let PR plans run in parallel per branch.
  group: gcp-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write          # required by google-github-actions/auth (WIF)
  pull-requests: write     # required to post the plan comment

env:
  TF_VERSION: '1.9.8'
  TF_WORKING_DIR: terraform/gcp
  ARTIFACT_REPO: oscal-tools
  IMAGE_NAME: oscal-tools

jobs:
  # ---------------------------------------------------------------------------
  # PR: terraform plan, no apply
  # ---------------------------------------------------------------------------
  terraform-plan:
    name: Terraform Plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Terraform validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        # `pipefail` is critical: without it, the exit status of the pipeline
        # is `tee`'s (always 0), so terraform refresh/plan errors silently
        # report the step as success and the plan-pass-required check below
        # never fires. We learned this the hard way — a missing IAM role
        # caused refresh to 403 and the workflow happily marked the PR green.
        shell: bash
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -lock-timeout=5m \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="region=${{ vars.GCP_REGION }}" \
            -var="image_tag=${{ github.event.pull_request.head.sha }}" \
            -var="otel_enabled=${{ vars.OTEL_ENABLED || 'false' }}" \
            -var="otel_collector_image=${{ vars.OTEL_COLLECTOR_IMAGE }}" \
            -var="alert_email=${{ vars.ALERT_EMAIL }}" \
            -var="hubspot_service_key=${{ secrets.HUBSPOT_SERVICE_KEY }}" \
            -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v7
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const planPath = path.join('${{ env.TF_WORKING_DIR }}', 'plan.txt');
            let plan = fs.existsSync(planPath) ? fs.readFileSync(planPath, 'utf8') : '(plan output missing)';
            // GitHub comment cap is 65535 chars; trim aggressively.
            const MAX = 60000;
            if (plan.length > MAX) {
              plan = plan.slice(0, MAX) + '\n...[truncated, see workflow logs]';
            }
            const body = [
              '### Terraform Plan',
              '',
              `- fmt: \`${process.env.FMT_OUTCOME}\``,
              `- validate: \`${process.env.VALIDATE_OUTCOME}\``,
              `- plan: \`${process.env.PLAN_OUTCOME}\``,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```hcl',
              plan,
              '```',
              '',
              '</details>',
            ].join('\n');

            // Replace prior plan comment from this workflow rather than spamming.
            const marker = '### Terraform Plan';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body && c.body.startsWith(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail job if plan failed
        if: steps.plan.outcome != 'success'
        run: exit 1

  # ---------------------------------------------------------------------------
  # main / manual: build image, push, apply, health-check
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build and Push Image
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image_uri: ${{ steps.meta.outputs.uri }}
    steps:
      # submodules: recursive pulls in the claude-plugins submodule whose
      # SKILL.md files are baked into the JAR and loaded at runtime by
      # KnowledgeLoader. Without this the AI wizards run without skill context.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Compute image metadata
        id: meta
        run: |
          TAG="${GITHUB_SHA}"
          URI="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "uri=${URI}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push combined image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.uri }}
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform-apply:
    name: Terraform Apply
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build-and-push
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    outputs:
      app_url: ${{ steps.outputs.outputs.app_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Terraform apply
        run: |
          terraform apply -auto-approve -input=false -lock-timeout=10m \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="region=${{ vars.GCP_REGION }}" \
            -var="image_tag=${{ needs.build-and-push.outputs.image_tag }}" \
            -var="otel_enabled=${{ vars.OTEL_ENABLED || 'false' }}" \
            -var="otel_collector_image=${{ vars.OTEL_COLLECTOR_IMAGE }}" \
            -var="alert_email=${{ vars.ALERT_EMAIL }}" \
            -var="hubspot_service_key=${{ secrets.HUBSPOT_SERVICE_KEY }}"

      - name: Capture outputs
        id: outputs
        run: |
          APP_URL=$(terraform output -raw app_url)
          echo "app_url=${APP_URL}" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployment"
            echo ""
            echo "- **Image:** \`${{ needs.build-and-push.outputs.image_uri }}\`"
            echo "- **App URL:** ${APP_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

  health-check:
    name: Health Check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: terraform-apply
    runs-on: ubuntu-latest
    steps:
      - name: Wait for revision to roll out and probe /api/health
        env:
          APP_URL: ${{ needs.terraform-apply.outputs.app_url }}
        run: |
          set -euo pipefail
          echo "Probing ${APP_URL}/api/health"
          for i in $(seq 1 30); do
            CODE=$(curl -fsS -o /dev/null -w '%{http_code}' "${APP_URL}/api/health" || echo 000)
            echo "attempt ${i}: HTTP ${CODE}"
            if [ "${CODE}" = "200" ]; then
              echo "Healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Health check did not reach 200 after 5 minutes." >&2
          exit 1
